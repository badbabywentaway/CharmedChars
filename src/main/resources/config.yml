# CharmedChars Configuration File
# Letter block word-building game for Minecraft

# Letter Block Drop Configuration
letter-blocks:
  # Base drop chance when breaking logs with gold tools (12.5%)
  drop-chance: 0.125

  # Drop chance multiplier with Fortune enchantment
  fortune-multipliers:
    1: 2.0  # Fortune I: 25%
    2: 3.0  # Fortune II: 37.5%
    3: 4.0  # Fortune III: 50%

  # Additional drops for nether wood (warped/crimson stems)
  nether-drops-numbers: true
  nether-drops-operators: true

  # Minimum word length requirements
  min-word-length:
    # Minimum length for same-color words
    same-color: 3
    # Minimum length for multi-color words
    multi-color: 4

  # Word Game Rewards
  # Rewards given when players successfully score words with letter blocks
  # Formula: netAmount = (score - minimumThreshold) × multiplier + minimumRewardCount
  # Then capped at maximumRewardCap and rounded to integer
  Drop:
    # Tier 1: Iron Ingots (easier to get)
    - materialName: "IRON_INGOT"
      # Always get at least 1 ingot
      minimumRewardCount: 1.0
      # Conversion rate: 0.01 ingots per point over threshold
      multiplier: 0.01
      # Score needed for bonus calculation
      minimumThreshold: 100.0
      # Maximum ingots that can drop
      maximumRewardCap: 20.0

    # Tier 2: Gold Nuggets (higher scores)
    - materialName: "GOLD_NUGGET"
      # No base reward below threshold
      minimumRewardCount: 0.0
      # Conversion rate: 0.01 nuggets per point over threshold
      multiplier: 0.01
      # Need 200+ score to get any nuggets
      minimumThreshold: 200.0
      # Maximum nuggets that can drop
      maximumRewardCap: 50.0

# Word Scoring Configuration
scoring:
  # Base score multiplier
  base-multiplier: 10

  # Bonus multiplier for same-color words
  same-color-multiplier: 3

# Protection Integration (Optional Plugins)
# These plugins are OPTIONAL soft dependencies - the plugin works without them
# Set to false to disable integration even if the plugin is installed
protection:
  # Respect WorldGuard regions (requires WorldGuard plugin)
  # If WorldGuard is not installed, this setting has no effect
  worldguard-integration: true

  # Respect GriefPrevention claims (requires GriefPrevention plugin)
  # If GriefPrevention is not installed, this setting has no effect
  griefprevention-integration: true

# Number Score Rewards for Structures
# Score-based rewards for solving number puzzles in bastions and fortresses
# The 3-digit number (0-999) is used as the score for calculating rewards
number-score-rewards:
  # Nether Fortress number game rewards
  fortress:
    Drop:
      - materialName: "BLAZE_ROD"
        # Base reward always given
        minimumRewardCount: 24.0
        # Points-to-items conversion rate
        multiplier: 0.02
        # Score needed for bonus calculation
        minimumThreshold: 100.0
        # Maximum items that can drop
        maximumRewardCap: 30.0

  # Bastion Remnant number game rewards
  bastion:
    Drop:
      - materialName: "ENDER_PEARL"
        # Base reward always given
        minimumRewardCount: 16.0
        # Points-to-items conversion rate
        multiplier: 0.025
        # Score needed for bonus calculation
        minimumThreshold: 100.0
        # Maximum items that can drop
        maximumRewardCap: 40.0

      - materialName: "NETHERITE_UPGRADE_SMITHING_TEMPLATE"
        # Always give exactly 1 template
        minimumRewardCount: 1.0
        multiplier: 0.0
        minimumThreshold: 0.0
        maximumRewardCap: 1.0

      - materialName: "ANCIENT_DEBRIS"
        # Minimum 1, scales up to 5 based on score
        minimumRewardCount: 1.0
        # Scales with score (higher numbers = more debris)
        multiplier: 0.004
        minimumThreshold: 0.0
        # Maximum 5 ancient debris
        maximumRewardCap: 5.0

# Exclude Zone Configuration (Example)
# Define areas where letter blocks won't work
# This is an example spawn protection zone from (-10, 0, -10) to (10, 0, 10)
exclude:
  from:
    ==: org.bukkit.Location
    world: world
    x: -10.0
    y: 0.0
    z: -10.0
    pitch: 0.0
    yaw: 0.0
  to:
    ==: org.bukkit.Location
    world: world
    x: 10.0
    y: 0.0
    z: 10.0
    pitch: 0.0
    yaw: 0.0

# Glassing Beds Feature
# When a bed explodes in the Nether or End, convert nearby lava to glass
glassing-beds:
  # Enable/disable the glassing beds feature
  # When enabled, lava blocks within 5 blocks of bed explosions turn to glass
  # Only works in Nether and End dimensions (where beds naturally explode)
  enabled: false

  # Maximum Y-level for lava-to-glass conversion
  # Only lava blocks at or below this Y-level will be converted to glass
  # This prevents using beds to glass lava ocean surfaces (Y=31) for easy travel
  # Recommended: 28 (allows underground lava but not ocean surface)
  max-y: 28
