name: CharmedChars
version: ${version}
main: org.stephanosbad.charmedChars.CharmedChars
api-version: '1.21'
load: POSTWORLD
softdepend: [ItemsAdder, Oraxen, Nexo, ProtocolLib, WorldGuard, GriefPrevention]
authors: [ StephanosBad ]
description: Open source word-forming puzzle game plugin for Minecraft (LGPL v3)
commands:
  charmedChars:
    usage: /charmedChars <player> <string>
    description: Give a string of letter or number blocks to a player.
  charblock:
    usage: /charblock <player> <color> <text>
    description: Give custom character blocks to a player.
    permission: charmedChars.blocks
  reload:
    description: Reload the plugin configuration
    usage: /charmedChars reload
    permission: charmedChars.admin
  iastatus:
    description: Check ItemsAdder integration status
    usage: /iastatus
    permission: charmedchars.admin
    aliases: [itemsadderstatus, charmeddebug]
  iasetup:
    description: Auto-setup ItemsAdder configuration (copy configs & textures)
    usage: /iasetup [force]
    permission: charmedchars.admin
    aliases: [setupitemsadder, iaconfig]
  oraxensetup:
    description: Auto-setup Oraxen configuration (generate configs & copy textures)
    usage: /oraxensetup [force]
    permission: charmedchars.admin
    aliases: [setuporaxen, oxsetup]
  nexosetup:
    description: Auto-setup Nexo configuration (generate configs & copy textures)
    usage: /nexosetup [force]
    permission: charmedchars.admin
    aliases: [setupnexo, nxsetup]
  version:
    description: Display plugin version and recent changes
    usage: /version
    aliases: [ver, charmedcharsversion]
  structurecode:
    description: View the three-digit code for the current fortress or bastion
    usage: /structurecode
    permission: charmedchars.blocks
    aliases: [scode, fortresscode, bastioncode]
  structuredb:
    description: View, query, and manage the structure database
    usage: /structuredb <list|player|lookup|stats|remove|purge> [args]
    permission: charmedchars.blocks
    aliases: [sdb, structuredatabase]
  glassingbeds:
    description: Manage the Glassing Beds feature (convert lava to glass on bed explosions)
    usage: /glassingbeds <enable|disable|status>
    permission: charmedchars.admin
    aliases: [gbeds, bedglass]

permissions:
  charmedChars.blocks:
    description: Allows giving character blocks to players and managing structures
    default: op
  charmedChars.admin:
    description: Admin permissions for the plugin (includes block permissions)
    default: op
    children:
      charmedChars.blocks: true
  charmedChars.*:
    description: Gives access to all CharmedChars permissions
    children:
      charmedChars.blocks: true
      charmedChars.admin: true
    default: op
