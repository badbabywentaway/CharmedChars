info:
  namespace: charmedchars

recipes:
  crafting_table:
    pyrite_ingot_recipe:
      enabled: true
      shapeless: true
      ingredients:
        I: IRON_INGOT
        R: REDSTONE
      result:
        item: charmedchars:pyrite_ingot
        amount: 1

    pyrite_ingot_sulfur_recipe:
      enabled: true
      shapeless: true
      ingredients:
        I: IRON_INGOT
        S: POTENT_SULFUR
      result:
        item: charmedchars:pyrite_ingot
        amount: 1

    pyrite_pickaxe_recipe:
      enabled: true
      pattern:
        - PPP
        - " S "
        - " S "
      ingredients:
        P: charmedchars:pyrite_ingot
        S: STICK
      result:
        item: charmedchars:pyrite_pickaxe
        amount: 1

    pyrite_axe_recipe:
      enabled: true
      pattern:
        - "PP "
        - "PS "
        - " S "
      ingredients:
        P: charmedchars:pyrite_ingot
        S: STICK
      result:
        item: charmedchars:pyrite_axe
        amount: 1

    pyrite_shovel_recipe:
      enabled: true
