info:
  namespace: charmedchars

items:
  # ==================== PYRITE (FOOL'S GOLD) MATERIALS ====================

  pyrite_ingot:
    display_name: "Pyrite Ingot"
    permission: charmedchars.pyrite
    resource:
      material: GOLD_INGOT
      generate: true
      textures:
        - item/pyrite/ingot
    durability:
      max_custom_durability: 1
    recipes:
      shapeless:
        enabled: true
        ingredients:
          - IRON_INGOT
          - REDSTONE
        result:
          item: charmedchars:pyrite_ingot
          amount: 1

  pyrite_pickaxe:
    display_name: "Pyrite Pickaxe"
    permission: charmedchars.pyrite
    lore:
      - "&7A fool's gold pickaxe"
      - "&7Works like gold for scoring words"
      - "&7Iron-tier durability and stats"
    resource:
      material: GOLDEN_PICKAXE
      generate: true
      textures:
        - item/pyrite/pickaxe
    durability:
      max_custom_durability: 250
    specific_properties:
      tool:
        tier: IRON
    attribute_modifiers:
      mainhand:
        attackDamage: 4
        attackSpeed: -2.8
    recipes:
      shaped:
        enabled: true
        pattern:
          - PPP
          - " S "
          - " S "
        ingredients:
          P: charmedchars:pyrite_ingot
          S: STICK
        result:
          item: charmedchars:pyrite_pickaxe
          amount: 1

